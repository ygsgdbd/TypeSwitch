name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      version: ${{ steps.release_tag.outputs.version }}
      commit: ${{ steps.release_tag.outputs.commit }}
      asset_name: ${{ steps.release_artifact.outputs.asset_name }}
      sha256: ${{ steps.release_artifact.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::Production releases must use vX.Y.Z without leading zeros. Got ${RELEASE_TAG}."
            exit 1
          fi

          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error title=Invalid release tag::Tag ${RELEASE_TAG} must be an annotated tag."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "$HEAD_COMMIT" != "$TAG_COMMIT" ]]; then
            echo "::error title=Release source mismatch::Checked out ${HEAD_COMMIT}, expected tag commit ${TAG_COMMIT}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error title=Release tag not on main::Tag ${RELEASE_TAG} is not contained in origin/main."
            exit 1
          fi

          git tag --merged origin/main --list 'v*' |
            ruby script/validate_release_order.rb "$RELEASE_TAG"

          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "commit=$TAG_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: script/ensure_release_absent.sh "$GITHUB_REPOSITORY" "$RELEASE_TAG"

      - name: Check Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error title=Missing Sparkle signing key::Set the SPARKLE_ED_PRIVATE_KEY repository secret before publishing a release."
            exit 1
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode Project
        env:
          TUIST_APP_VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          TUIST_BUILD_VERSION=$(date -u "+%Y%m%d%H%M")
          export TUIST_BUILD_VERSION
          tuist generate --no-open

      - name: Test
        run: |
          xcodebuild test \
            -project TypeSwitch.xcodeproj \
            -scheme TypeSwitch \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive App
        run: |
          xcodebuild \
            -project TypeSwitch.xcodeproj \
            -scheme TypeSwitch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath ./DerivedData/Archives/TypeSwitch.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64"

      - name: Verify Universal Binary
        run: |
          BINARY_PATH="DerivedData/Archives/TypeSwitch.xcarchive/Products/Applications/TypeSwitch.app/Contents/MacOS/TypeSwitch"
          ARCHITECTURES=$(lipo -archs "$BINARY_PATH")
          if [[ " $ARCHITECTURES " != *" arm64 "* || " $ARCHITECTURES " != *" x86_64 "* ]]; then
            echo "::error title=Invalid binary architectures::Expected arm64 and x86_64, got ${ARCHITECTURES}."
            exit 1
          fi

      - name: Package App
        run: |
          mkdir -p DerivedData/Exports
          ditto DerivedData/Archives/TypeSwitch.xcarchive/Products/Applications/TypeSwitch.app DerivedData/Exports/TypeSwitch.app
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Exports/TypeSwitch.app TypeSwitch-macOS-universal.zip

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          if ! awk -v heading="## ${RELEASE_TAG}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md; then
            echo "::error title=Missing release notes::CHANGELOG.md does not contain a ## ${RELEASE_TAG} section."
            exit 1
          fi

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error title=Missing release notes::CHANGELOG.md must contain a non-empty ## ${RELEASE_TAG} section."
            exit 1
          fi

      - name: Generate Checksums
        id: release_artifact
        run: |
          ASSET_NAME="TypeSwitch-macOS-universal.zip"
          SHA256=$(shasum -a 256 "$ASSET_NAME" | awk '{print $1}')
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "### SHA-256 Checksums"
            echo '```'
            echo "$SHA256  $ASSET_NAME"
            echo '```'
          } > checksums.txt

          {
            echo "## TypeSwitch ${{ steps.release_tag.outputs.tag }}"
            echo
            cat release-notes.md
            echo
            echo "### Build"
            echo
            echo "- Universal Binary (Apple Silicon + Intel)"
            echo "- macOS 14.0+"
            echo
            cat checksums.txt
          } > release-body.md

      - name: Download Sparkle tools
        run: |
          SPARKLE_ARCHIVE="Sparkle-2.9.4.tar.xz"
          EXPECTED_SHA256="ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9"
          curl -fsSL -o "$SPARKLE_ARCHIVE" "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/$SPARKLE_ARCHIVE"

          ACTUAL_SHA256=$(shasum -a 256 "$SPARKLE_ARCHIVE" | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error title=Sparkle checksum mismatch::Expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}."
            exit 1
          fi

          mkdir -p sparkle-tools
          tar -xf "$SPARKLE_ARCHIVE" -C sparkle-tools --strip-components=1

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p DerivedData/SparkleFeed
          cp TypeSwitch-macOS-universal.zip DerivedData/SparkleFeed/
          cp release-notes.md DerivedData/SparkleFeed/TypeSwitch-macOS-universal.md

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/ygsgdbd/TypeSwitch/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/ygsgdbd/TypeSwitch" \
            --embed-release-notes \
            --maximum-versions 1 \
            DerivedData/SparkleFeed

          cp DerivedData/SparkleFeed/appcast.xml appcast.xml

      - name: Verify release artifacts
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: script/verify_release.sh "$RELEASE_TAG" .

      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: TypeSwitch-macOS-universal.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TypeSwitch-macOS-universal.zip
            checksums.txt
            appcast.xml
          body_path: release-body.md
          draft: false
          prerelease: false
          overwrite_files: false
          tag_name: ${{ steps.release_tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew cask
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}

      - name: Download published release asset
        env:
          ASSET_NAME: ${{ needs.publish.outputs.asset_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "$ASSET_NAME"

          ACTUAL_SHA256=$(sha256sum "release-assets/$ASSET_NAME" | awk '{print $1}')
          if [[ "$ACTUAL_SHA256" != "${{ needs.publish.outputs.sha256 }}" ]]; then
            echo "::error title=Published asset checksum mismatch::Expected ${{ needs.publish.outputs.sha256 }}, got ${ACTUAL_SHA256}."
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ygsgdbd/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update and push Homebrew cask
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
        run: |
          ruby script/update_homebrew_cask.rb homebrew-tap/Casks/typeswitch.rb "$RELEASE_TAG" "$SHA256"

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/typeswitch.rb

          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git commit -m "Update TypeSwitch cask to ${RELEASE_TAG}"
          git push
